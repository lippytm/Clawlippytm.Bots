[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawlippytm-bots"
version = "0.1.0"
description = "The Full Stack AI Toolkits — ultimate ClawBot and OpenClaw solution with LLM-powered agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.28",
    "tiktoken>=0.7",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "responses>=0.25",
]

[project.scripts]
clawbots = "clawlippytm_bots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = false
ignore_missing_imports = true
